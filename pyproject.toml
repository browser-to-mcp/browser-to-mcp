[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "browser-to-mcp"
version = "0.0.1"
description = "Turn reviewed browser workflows into typed, reliable MCP tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Browser to MCP" }]
dependencies = [
  "mcp>=1.27,<2",
  "playwright>=1.61.0,<2",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
]

[project.scripts]
browser-to-mcp = "browser_to_mcp.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
