name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run playwright install --with-deps chromium
      - name: Unit and existing browser checks
        run: uv run pytest --ignore=tests/authoring/test_journey.py
      - name: Real recording-to-MCP journey and 30 controlled runs
        run: uv run pytest tests/authoring/test_journey.py -q
