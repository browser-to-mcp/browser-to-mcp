name: hn_search
description: Search Hacker News and return visible matching results.
version: 1
risk: read_only

manifest:
  version: 1

permissions:
  allowed_domains:
    - hn.algolia.com
    - cdn.jsdelivr.net
    - telemetry.algolia.com
    - www.google-analytics.com
    - www.googletagmanager.com
    - uj5wyc0l7x-dsn.algolia.net
  downloads: false
  uploads: false
  submit_forms: false
  send_messages: false
  spend_money: false

inputs:
  query:
    type: string
    required: true
    min_length: 1
    description: Search query.

steps:
  - id: search
    action: goto
    url: https://hn.algolia.com/?q={{query}}
    timeout_seconds: 30
    risk: read_only
    idempotency: safe
    retry: none
    confirmation: never
  - id: wait_for_results
    action: wait_for_text
    text: points
    timeout_seconds: 30
    risk: read_only
    idempotency: safe
    retry: none
    confirmation: never
  - id: results
    action: extract_text
    selector: main
    timeout_seconds: 30
    risk: read_only
    idempotency: safe
    retry: none
    confirmation: never

outputs:
  results:
    type: string
    description: Visible matching results.

success:
  - id: results_present
    assertion: output_not_empty
    field: results
